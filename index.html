<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BOQUILA</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2E3524;
    --cream: #E8DFC6;
    --size: min(92vw, 38rem, 85svh);
  }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: "Lora", Georgia, serif;
    overflow: hidden;
  }

  /* Language visibility, same convention as the main site */
  html[data-lang="es"] [data-en],
  html[data-lang="en"] [data-es] { display: none; }

  /* Logo, perfectly centred. Blend mode hides the image's own square edge. */
  .logo {
    position: fixed;
    top: 50%;
    left: 50%;
    width: var(--size);
    height: auto;
    transform: translate(-50%, -50%);
    mix-blend-mode: lighten;
  }

  /* Sits just beneath the drawing */
  .soon {
    position: fixed;
    left: 0;
    right: 0;
    top: calc(50% + var(--size) * 0.27);
    margin: 0;
    padding-left: 0.32em; /* offsets trailing letter-spacing so text is truly centred */
    text-align: center;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  /* Language toggle, top right */
  .lang-toggle {
    position: fixed;
    top: 1.6rem;
    right: 1.8rem;
    display: flex;
    gap: 0.9em;
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
  }

  .lang-toggle button {
    background: none;
    border: none;
    padding: 0 0 0.2em;
    color: var(--cream);
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    cursor: pointer;
    opacity: 0.5;
    border-bottom: 1px solid transparent;
    transition: opacity 0.2s ease;
  }

  .lang-toggle button:hover { opacity: 0.85; }

  .lang-toggle button[aria-pressed="true"] {
    opacity: 1;
    border-bottom-color: var(--cream);
  }

  .lang-toggle button:focus-visible {
    outline: 1px solid var(--cream);
    outline-offset: 4px;
  }

  /* Instagram, bottom centre */
  .ig {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    width: 1.8rem;
    height: 1.8rem;
    color: var(--cream);
    opacity: 0.75;
    transition: opacity 0.2s ease;
  }

  .ig:hover { opacity: 1; }
  .ig:focus-visible { outline: 1px solid var(--cream); outline-offset: 6px; }
  .ig svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

  <div class="lang-toggle" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang-btn="es" aria-pressed="true">ES</button>
    <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
  </div>

  <img class="logo" src="logo.png" alt="BOQUILA">

  <p class="soon">
    <span data-es>Próximamente</span>
    <span data-en>Coming Soon</span>
  </p>

  <a class="ig" href="https://www.instagram.com/boquilaco/" target="_blank" rel="noopener" aria-label="Instagram @boquilaco">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <defs>
        <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
        </filter>
      </defs>
      <g filter="url(#ink)">
        <rect x="3" y="3" width="18" height="18" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.4" cy="6.6" r="0.6" fill="currentColor"/>
      </g>
    </svg>
  </a>

<script>
  /* Same storage key as the main site, so the choice carries over when it launches. Default: Spanish. */
  (function () {
    var KEY = "boquila-lang";
    var DEFAULT = "es";

    function get() {
      try { return localStorage.getItem(KEY) || DEFAULT; } catch (e) { return DEFAULT; }
    }

    function set(lang) {
      document.documentElement.setAttribute("data-lang", lang);
      document.documentElement.setAttribute("lang", lang);
      try { localStorage.setItem(KEY, lang); } catch (e) {}
      document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === lang);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      set(get());
      document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
        b.addEventListener("click", function () { set(b.getAttribute("data-lang-btn")); });
      });
    });
  })();
</script>

</body>
</html>
